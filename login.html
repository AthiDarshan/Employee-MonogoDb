<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Employee Management System</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-container {
            width: 400px;
            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #1f4e79;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #1f4e79;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #163a5c;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .credentials {
            margin-top: 25px;
            padding: 15px;
            background: #f0f4f8;
            border-radius: 6px;
            font-size: 14px;
        }

    </style>

</head>

<body>

<div class="login-container">

    <h1>Employee Management System</h1>

    <p class="subtitle">
        Login to continue
    </p>

    <form id="loginForm">

        <label>Login Type</label>

        <select id="role" required>

            <option value="">
                Select Login Type
            </option>

            <option value="employee">
                Employee Login
            </option>

            <option value="admin">
                Admin Login
            </option>

        </select>

        <label>Username</label>

        <input
            type="text"
            id="username"
            placeholder="Enter username"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p id="message"></p>

    <div class="credentials">

        <strong>Demo Login Details</strong>

        <br><br>

        <b>Admin:</b>

        <br>

        Username: admin

        <br>

        Password: admin123

        <br><br>

        <b>Employee:</b>

        <br>

        Username: E101

        <br>

        Password: employee123

    </div>

</div>

<script>

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const role =
            document.getElementById("role").value;

        const username =
            document.getElementById("username").value;

        const password =
            document.getElementById("password").value;

        try {

            const response =
                await fetch("/api/login", {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        role: role,

                        username: username,

                        password: password

                    })

                });

            const result =
                await response.json();

            if (!response.ok) {

                document
                    .getElementById("message")
                    .textContent = result.message;

                document
                    .getElementById("message")
                    .style.color = "red";

                return;
            }

            localStorage.setItem(
                "token",
                result.token
            );

            localStorage.setItem(
                "role",
                result.role
            );

            localStorage.setItem(
                "username",
                result.username
            );

            if (result.role === "admin") {

                window.location.href =
                    "/employee-list.html";

            }
            else {

                window.location.href =
                    "/index.html";

            }

        }

        catch(error) {

            console.error(error);

            document
                .getElementById("message")
                .textContent =
                    "Unable to connect to server.";

            document
                .getElementById("message")
                .style.color = "red";

        }

    });

</script>

</body>

</html>
