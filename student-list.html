<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        header {
            background: #1f4e79;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            padding: 10px 18px;
            background: #1f4e79;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        .logout {
            background: #c0392b;
        }

        .employee-card {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .employee-card h2 {
            color: #1f4e79;
        }

        .employee-info {
            line-height: 1.8;
        }

        .delete-button {
            background: #c0392b;
        }

        .edit-button {
            background: #27ae60;
        }

        .empty {
            background: white;
            padding: 30px;
            margin-top: 20px;
            text-align: center;
            border-radius: 10px;
        }

    </style>

</head>

<body>

<header>

    <h1>Admin Dashboard</h1>

    <p>Employee Management System</p>

</header>

<div class="container">

    <div class="top-bar">

        <h2>Employee Profiles</h2>

        <div>

            <button onclick="loadEmployees()">
                Refresh
            </button>

            <button
                class="logout"
                onclick="logout()">
                Logout
            </button>

        </div>

    </div>

    <div id="employeeList"></div>

</div>

<script>

const token =
    localStorage.getItem("token");

const role =
    localStorage.getItem("role");

if (!token || role !== "admin") {

    window.location.href =
        "/login.html";

}

async function loadEmployees() {

    try {

        const response =
            await fetch("/api/data", {

                headers: {

                    "Authorization":
                        token

                }

            });

        const employees =
            await response.json();

        if (!response.ok) {

            alert(employees.message);

            return;

        }

        const employeeList =
            document.getElementById(
                "employeeList"
            );

        employeeList.innerHTML = "";

        if (employees.length === 0) {

            employeeList.innerHTML = `

                <div class="empty">

                    <h3>
                        No Employee Records
                    </h3>

                    <p>
                        No employees found.
                    </p>

                </div>

            `;

            return;

        }

        employees.forEach(
            function(employee) {

                const card =
                    document.createElement("div");

                card.className =
                    "employee-card";

                card.innerHTML = `

                    <h2>
                        ${employee.name}
                    </h2>

                    <div class="employee-info">

                        <strong>
                            Employee ID:
                        </strong>

                        ${employee.employeeId}

                        <br>

                        <strong>
                            Department:
                        </strong>

                        ${employee.department}

                        <br>

                        <strong>
                            Designation:
                        </strong>

                        ${employee.designation}

                        <br>

                        <strong>
                            Salary:
                        </strong>

                        ${employee.salary}

                        <br>

                        <strong>
                            Experience:
                        </strong>

                        ${employee.experience} years

                        <br>

                        <strong>
                            Skills:
                        </strong>

                        ${
                            Array.isArray(employee.skills)
                            ? employee.skills.join(", ")
                            : employee.skills
                        }

                        <br>

                        <strong>
                            Status:
                        </strong>

                        ${employee.status}

                    </div>

                    <button
                        class="edit-button"
                        onclick="editEmployee('${employee._id}')">

                        Edit Employee

                    </button>

                    <button
                        class="delete-button"
                        onclick="deleteEmployee('${employee._id}')">

                        Delete Employee

                    </button>

                `;

                employeeList.appendChild(card);

            }
        );

    }

    catch(error) {

        console.error(error);

        alert(
            "Error loading employee records."
        );

    }

}

async function deleteEmployee(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this employee?"
        );

    if (!confirmDelete) {

        return;

    }

    try {

        const response =
            await fetch(
                `/api/data/${id}`,
                {

                    method: "DELETE",

                    headers: {

                        "Authorization":
                            token

                    }

                }
            );

        const result =
            await response.json();

        alert(result.message);

        loadEmployees();

    }

    catch(error) {

        console.error(error);

        alert(
            "Error deleting employee."
        );

    }

}

async function editEmployee(id) {

    const newName =
        prompt(
            "Enter new employee name:"
        );

    if (!newName) {

        return;

    }

    try {

        const response =
            await fetch(
                `/api/data/${id}`,
                {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            token

                    },

                    body: JSON.stringify({

                        name: newName

                    })

                }
            );

        const result =
            await response.json();

        alert(result.message);

        loadEmployees();

    }

    catch(error) {

        console.error(error);

        alert(
            "Error updating employee."
        );

    }

}

function logout() {

    fetch(
        "/api/logout",
        {

            method: "POST",

            headers: {

                "Authorization":
                    token

            }

        }
    );

    localStorage.removeItem("token");

    localStorage.removeItem("role");

    localStorage.removeItem("username");

    window.location.href =
        "/login.html";

}

loadEmployees();

</script>

</body>

</html>
